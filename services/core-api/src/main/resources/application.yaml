server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: UPDISH_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
spring:
  application:
    name: updish-core-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/updish}
    username: ${POSTGRES_USER:updish}
    password: ${POSTGRES_PASSWORD:updish-local-only}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
updish:
  demo:
    operator-wallet: ${DEMO_OPERATOR_WALLET:0x26473024a9118e8f39b1a0ce01ac726c36dd0976}
  auth:
    allowed-origins: ${UPDISH_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000}
  chain:
    rpc-url: ${GIWA_RPC_URL:https://sepolia-rpc.giwa.io}
