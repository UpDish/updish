name: updish
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-updish}
      POSTGRES_USER: ${POSTGRES_USER:-updish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  core-api:
    profiles: [app]
    build: ../services/core-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-updish}
      POSTGRES_USER: ${POSTGRES_USER:-updish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      GIWA_RPC_URL: ${GIWA_RPC_URL:-https://sepolia-rpc.giwa.io}
      UPDISH_ALLOWED_ORIGINS: ${UPDISH_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1400m
    restart: unless-stopped
  agent-api:
    profiles: [app]
    build: ../services/agent-api
    expose: [8000]
    mem_limit: 700m
    restart: unless-stopped
volumes:
  postgres-data:
